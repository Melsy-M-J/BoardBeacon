<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoardBeacon - Board Games & Daily Challenges with Move Replay</title>
    <meta name="description" content="A modern, interactive platform to play classic board games with Daily Challenges, unique puzzles, rewards, and step-by-step move history recording." />
    <meta property="og:title" content="BoardBeacon - Board Games & Daily Challenges with Move Replay" />
    <meta property="og:description" content="A modern, interactive platform to play classic board games with Daily Challenges, unique puzzles, rewards, and step-by-step move history recording." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-primary': '#1a2a40',
              'brand-secondary': '#2a4a6b',
              'brand-accent': '#64ffda',
              'brand-light': '#ccd6f6',
              'brand-dark': '#0a192f',
              'brand-surface': '#112240',
              'brand-card': '#162b4d',
              'brand-border': '#233554',
              'brand-highlight': '#233554',
            },
            fontFamily: {
              'sans': ['Inter', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-in-out',
              'slide-in-up': 'slideInUp 0.3s ease-out',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scale-in': 'scaleIn 0.2s ease-out',
              'pop-in': 'popIn 0.2s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideInUp: {
                '0%': { transform: 'translateY(16px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.96)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              popIn: {
                '0%': { opacity: '0', transform: 'scale(0.9) translateY(4px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              },
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0a192f;
        color: #ccd6f6;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
  </head>
  <body class="bg-brand-dark text-brand-light antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
